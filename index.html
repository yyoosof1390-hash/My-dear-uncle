<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوپرایز دایی جون 🎉</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow-x:hidden;
    font-family:Tahoma, Arial, sans-serif;
    background:linear-gradient(135deg,#160b2d,#3b145f,#8b245f);
    color:#fff; display:flex; justify-content:center; align-items:center;
  }
  .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .star{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;
    box-shadow:0 0 12px #fff;animation:twinkle 2s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
  .page{width:min(94%,720px);padding:25px 0;position:relative;z-index:2}
  .card{
    background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-radius:28px; padding:32px 22px; text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
  }
  .emoji{font-size:58px;animation:bounce 1.5s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:clamp(28px,7vw,48px);margin:12px 0 10px;color:#ffe49a}
  p{font-size:clamp(17px,4.5vw,22px);line-height:2;margin:10px auto;max-width:600px}
  button{
    border:0; border-radius:18px; padding:16px 30px; margin-top:20px;
    font-size:20px; font-weight:bold; cursor:pointer; color:#3b145f;
    background:linear-gradient(135deg,#ffd76a,#fff0a8);
    box-shadow:0 10px 30px rgba(255,215,106,.3);
    transition:.2s;
  }
  button:hover{transform:translateY(-3px) scale(1.02)}
  #surprise{display:none;animation:appear .9s ease}
  @keyframes appear{from{opacity:0;transform:scale(.9) translateY(25px)}to{opacity:1;transform:none}}
  .photo{
    width:100%; max-width:560px; display:block; margin:25px auto 18px;
    border-radius:22px; border:4px solid rgba(255,226,140,.75);
    box-shadow:0 15px 45px rgba(0,0,0,.45);
  }
  .message{
    background:rgba(255,255,255,.1);border-radius:20px;padding:18px;
    margin-top:15px;color:#fff4ce
  }
  .heart{font-size:34px;display:inline-block;animation:heart 1s infinite}
  @keyframes heart{50%{transform:scale(1.25)}}
  .confetti{position:fixed;top:-20px;font-size:25px;z-index:5;animation:fall 4s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  .small{font-size:13px;opacity:.65;margin-top:20px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="page">
  <div class="card">
    <div id="intro">
      <div class="emoji">🎁</div>
      <h1>آماده سوپرایز هستی دایی جون؟</h1>
      <p>یه سورپرایز کوچولو و دوست‌داشتنی برای دایی عزیزمون آماده شده ❤️</p>
      <button onclick="showSurprise()">🎉 این دکمه رو بزن!</button>
    </div>

      <p class="small">با کلی عشق و آرزوی سلامتی و شادی 🌹</p>
    </div>
  </div>
</div>

<script>
  const stars=document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*2)+'s';
    stars.appendChild(s);
  }

  function showSurprise(){
    document.getElementById('intro').style.display='none';
    document.getElementById('surprise').style.display='block';
    for(let i=0;i<45;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.textContent=['🎉','🎊','✨','❤️','🎈','🥳'][Math.floor(Math.random()*6)];
      c.style.left=Math.random()*100+'%';
      c.style.animationDelay=(Math.random()*1.5)+'s';
      c.style.fontSize=(18+Math.random()*18)+'px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    }
  }
</script>
</body>
</html>
